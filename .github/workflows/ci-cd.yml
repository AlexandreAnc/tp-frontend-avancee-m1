# CI : lint, types, tests avec seuils de couverture (PostgreSQL + pgvector) et parcours E2E dans un navigateur,
# sur chaque push et pull request.
# CD : sur main, images construites ici (le VPS de 4 Go ne compile rien), publiées sur GHCR,
# puis déployées sur le VPS par SSH (deploy/deploy.sh : pull, migrations, redémarrage).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: '**/coverage/'
          retention-days: 14

  # Parcours réel dans Chromium contre l'app compilée : inscription, dépôt, reconnexion.
  # Il aurait attrapé les deux bugs vus seulement en prod (stockage non inscriptible, déconnexions sur 429).
  e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
      BETTER_AUTH_URL: http://localhost:3000
      STORAGE_DIR: ./.data/files
      VAPID_SUBJECT: mailto:ci@example.com
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Secrets jetables, générés pour ce job uniquement.
      - name: Secrets de test
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          node -e "const k=require('web-push').generateVAPIDKeys();console.log('VAPID_PUBLIC_KEY='+k.publicKey+'\\nVAPID_PRIVATE_KEY='+k.privateKey)" >> "$GITHUB_ENV"
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  image:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # GHCR exige un nom d'image en minuscules (le propriétaire du dépôt peut en contenir).
      - name: Nom des images
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dashia" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runtime
          push: true
          tags: ${{ env.IMAGE_REPO }}-web:${{ github.sha }},${{ env.IMAGE_REPO }}-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: migrate
          push: true
          tags: ${{ env.IMAGE_REPO }}-migrate:${{ github.sha }},${{ env.IMAGE_REPO }}-migrate:latest
          cache-from: type=gha

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PROD_URL || 'https://tp-developpement-fullstack-m1.aanc.fr' }}
    permissions:
      contents: read
      packages: read
    steps:
      # GHCR exige un nom d'image en minuscules (le propriétaire du dépôt peut en contenir).
      - name: Nom des images
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dashia" >> "$GITHUB_ENV"
      - name: Clé SSH du VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Déploiement
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Le jeton GHCR (valable le temps du job) passe par stdin, jamais dans la ligne de commande.
        run: |
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/id_deploy "$TARGET" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null \
            && cd /opt/dashia && git fetch --quiet origin main && git reset --quiet --hard ${{ github.sha }} \
            && IMAGE_REPO=${{ env.IMAGE_REPO }} IMAGE_TAG=${{ github.sha }} bash deploy/deploy.sh; \
            status=\$?; docker logout ghcr.io >/dev/null; exit \$status"

  # Vérifie la prod réelle (Cloudflare, Caddy, conteneurs) sans rien y écrire.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      E2E_BASE_URL: ${{ vars.PROD_URL || 'https://tp-developpement-fullstack-m1.aanc.fr' }}
      E2E_READONLY: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
