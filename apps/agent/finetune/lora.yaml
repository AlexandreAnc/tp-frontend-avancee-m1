# Entraînement LoRA de Qwen3-4B-Instruct-2507 sur les exemples du panel (mlx-lm, Apple Silicon).
# Seule la réponse attendue compte dans la perte (`mask_prompt`) : le modèle apprend à agir, pas à recopier le contexte.
model: Qwen/Qwen3-4B-Instruct-2507
train: true
fine_tune_type: lora
mask_prompt: true
num_layers: 16
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05
batch_size: 2
learning_rate: 1.0e-4
# Le plus long exemple fait ~4 560 tokens : au-delà, la réponse attendue serait tronquée.
max_seq_length: 4608
grad_checkpoint: true
steps_per_report: 10
steps_per_eval: 100
val_batches: 25
save_every: 200
seed: 0
