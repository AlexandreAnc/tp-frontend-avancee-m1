# Dev : `docker compose up -d db` puis lancer web et agent avec pnpm.
# Prod (VPS) : docker-compose.prod.yml, voir la section Déploiement du README.
# Agent conteneurisé (optionnel) : `docker compose --profile agent up -d agent`.
# Ollama n'est jamais conteneurisé ici : il tourne nativement sur la machine de l'agent.

name: pwa-agent-ia

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent:
    profiles: [agent]
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    restart: unless-stopped
    env_file: apps/agent/.env
    environment:
      # Ollama tourne sur l'hôte (GPU Apple Silicon / CUDA natif).
      OLLAMA_URL: ${AGENT_OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db-data:
