# Dev : `docker compose up -d db` puis lancer web et agent avec pnpm.
# Prod (VPS) : `docker compose --profile prod run --rm migrate` puis `docker compose --profile prod up -d web`.
# Agent conteneurisé (optionnel) : `docker compose --profile agent up -d agent`.
# Ollama n'est jamais conteneurisé ici : il tourne nativement sur la machine de l'agent.

name: pwa-agent-ia

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: [prod]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}

  web:
    profiles: [prod]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: apps/web/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      STORAGE_DIR: /data/files
    ports:
      - "3000:3000"
    volumes:
      - file-storage:/data/files

  agent:
    profiles: [agent]
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    restart: unless-stopped
    env_file: apps/agent/.env
    environment:
      # Ollama tourne sur l'hôte (GPU Apple Silicon / CUDA natif).
      OLLAMA_URL: ${AGENT_OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db-data:
  file-storage:
